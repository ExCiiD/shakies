<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5d73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shakies">
<title>Shakies</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f1; --card:#ffffff; --ink:#2b1d16; --muted:#7a6a60; --line:#f0e2d6;
  --accent:#ff5d73; --chip:#fff0e4; --shadow:0 8px 24px rgba(120,60,30,.10);
  --glass:rgba(255,255,255,.22); --glass-stroke:rgba(60,40,30,.35);
  --nav-h:64px; --top-h:56px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1412; --card:#251d1a; --ink:#f7ece4; --muted:#b5a49a; --line:#3a2e29;
    --chip:#33271f; --shadow:0 8px 24px rgba(0,0,0,.35); --glass:rgba(255,255,255,.08); --glass-stroke:rgba(255,255,255,.55); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;color:inherit}

/* ---------- Top bar & bottom nav ---------- */
.top{position:sticky;top:0;z-index:20;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;
  display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand small{font:500 .7rem Inter,sans-serif;color:var(--muted);display:block;margin-top:-2px}
.top .back{margin-right:auto;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.72rem;font-weight:600;color:var(--muted)}
.tabbar button span{font-size:1.35rem;line-height:1;transition:transform .2s}
.tabbar button.on{color:var(--accent)}
.tabbar button.on span{transform:translateY(-2px) scale(1.12)}
main{padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);max-width:900px;margin:0 auto}

/* ---------- Home ---------- */
.home{display:flex;gap:10px;min-height:calc(100dvh - var(--top-h) - var(--nav-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:28px;padding:14px 14px 18px;position:relative;overflow:hidden;isolation:isolate;justify-content:center}
.stage::before{content:"";position:absolute;inset:0;background:var(--halo);opacity:.55;z-index:-1;transition:background .6s}
.kicker{font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.cupwrap{margin-top:22px !important;width:min(66vw,290px);flex:0 1 auto;aspect-ratio:240/300;max-height:44vh;min-height:200px;display:grid;place-items:center;margin:4px 0;border:0;background:none;padding:0}
.cupwrap svg{width:100%;height:100%;overflow:visible}
.cupwrap.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}100%{transform:none}}
.stage h1{font-size:clamp(1.7rem,8vw,2.6rem);margin-top:4px}
.stage p{margin:6px 0 10px;color:var(--muted);font-size:.95rem;max-width:34ch}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:14px}
.badge{font-size:.75rem;font-weight:700;background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cta{display:flex;gap:10px;width:100%;max-width:360px}
.btn{flex:1;border:0;border-radius:18px;padding:15px 16px;font-weight:700;background:var(--ink);color:var(--bg);font-size:1rem}
.btn.alt{flex:0 0 auto;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:1.3rem;padding:12px 18px}
.btn:active{transform:scale(.96)}
.hint{font-size:.72rem;color:var(--muted);margin-top:10px}

/* mini sidebar */
.side{flex:0 0 auto;width:88px;transition:width .3s ease;display:flex;flex-direction:column;background:var(--card);border-radius:22px;
  box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.side.closed{width:30px}
.side .handle{border:0;background:none;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
.side .handle b{font-size:1rem;transition:transform .3s}
.side.closed .handle b{transform:rotate(180deg)}
.side .vlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.side.closed .list{opacity:0;pointer-events:none}
.side .list{display:flex;flex-direction:column;gap:12px;padding:4px 8px 12px;overflow-y:auto;transition:opacity .2s;scrollbar-width:none}
.side .list::-webkit-scrollbar{display:none}
.mini{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66rem;font-weight:600;line-height:1.15;text-align:center}
.mini .dot{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;box-shadow:inset 0 -6px 12px rgba(0,0,0,.08)}
.mini:active .dot{transform:scale(.92)}

/* ---------- List ---------- */
.title{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 12px}
.title h2{font-size:1.6rem}
.muted{color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 16px;font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* export courses */
.exleft{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;margin:4px 0 10px}
.exleft input{width:18px;height:18px;accent-color:var(--accent)}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exgrid button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 6px;font-weight:700;font-size:.82rem}
.exgrid button:active{transform:scale(.96)}
.exgrid .exmain{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:1rem;padding:13px}
.exgrid .exmain small{display:block;font-weight:500;font-size:.72rem;opacity:.9}
.expre{white-space:pre-wrap;font:500 .78rem/1.45 ui-monospace,Consolas,monospace;background:var(--chip);border-radius:14px;padding:12px;margin:12px 0 0;max-height:220px;overflow:auto}
.exmsg{font-size:.85rem;font-weight:600;color:var(--accent);margin-top:8px;min-height:1.2em}

/* filtres : une ligne par catégorie, flèches sur petit écran */
.fpanel{margin-top:6px}
.frow{margin-top:10px}
.frow .flabel{margin:0 0 2px}
.fnote{font-size:.76rem;color:var(--muted);margin:6px 0 0}
.scroller{position:relative;margin:0 -16px}
.scroller .chips{position:relative;margin:0;padding:6px 16px 6px;scroll-behavior:smooth;scroll-snap-type:x proximity;scroll-padding-inline:44px}
.scroller .chip{scroll-snap-align:start}
.scroller::before,.scroller::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none;opacity:0;transition:opacity .2s}
.scroller::before{left:0;background:linear-gradient(90deg,var(--bg) 35%,transparent)}
.scroller::after{right:0;background:linear-gradient(270deg,var(--bg) 35%,transparent)}
.scroller.can-l::before,.scroller.can-r::after{opacity:1}
.arr{position:absolute;top:50%;transform:translateY(-50%) scale(.8);z-index:2;width:30px;height:30px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);box-shadow:0 3px 10px rgba(0,0,0,.12);display:grid;place-items:center;font-size:1.15rem;line-height:1;font-weight:700;padding:0 0 2px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.arr.l{left:8px}.arr.r{right:8px}
.scroller.can-l .arr.l,.scroller.can-r .arr.r{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.arr:active{transform:translateY(-50%) scale(.9)}
@media (min-width:760px){
  .fpanel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px 14px;box-shadow:var(--shadow);margin-top:12px}
  .frow{display:grid;grid-template-columns:110px 1fr;align-items:start;gap:14px;margin-top:8px}
  .frow .flabel{margin:0;padding-top:14px}
  .scroller{margin:0}
  .scroller .chips{flex-wrap:wrap;overflow:visible;padding:6px 0 0;gap:6px}
  .scroller::before,.scroller::after,.arr{display:none}
  .fnote{margin-left:124px}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.card{background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px}
.card:active{transform:scale(.97)}
.card .sw{height:86px;border-radius:14px;display:grid;place-items:center;font-size:2.3rem;position:relative}
.card .sw .tx{position:absolute;right:6px;top:6px;font-size:.85rem;background:rgba(255,255,255,.75);border-radius:999px;padding:1px 6px}
.card h3{font-size:1rem}
.card .d{font-size:.78rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* ---------- Detail ---------- */
.dhero{display:flex;align-items:center;gap:12px;border-radius:26px;padding:14px 16px;position:relative;overflow:hidden;isolation:isolate}
.dhero::before{content:"";position:absolute;inset:0;background:var(--halo);opacity:.55;z-index:-1}
.dhero .cupwrap{width:120px;flex:none;min-height:0;height:150px;margin:0}
.dhero h1{font-size:1.7rem}
.dhero p{margin:4px 0 8px;color:var(--muted);font-size:.9rem}
.fav{border:0;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:14px}
.panel h3{font-size:1.15rem;margin-bottom:8px}
.size{display:flex;background:var(--chip);border-radius:14px;padding:3px;margin-bottom:6px}
.size button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:11px;font-size:.82rem;font-weight:700}
.size button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.ing li:last-child{border:0}
.ing .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:transparent}
.ing li.done{opacity:.45;text-decoration:line-through}
.ing li.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
.ing .q{font-weight:700;min-width:70px}
.ing .layer{margin-left:auto;font-size:.68rem;color:var(--muted)}
.prep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.prep div{background:var(--chip);border-radius:14px;padding:9px 10px;font-size:.72rem;color:var(--muted)}
.prep b{display:block;font-size:.9rem;color:var(--ink)}
.steps{margin:0;padding-left:20px}
.steps li{margin:7px 0;font-size:.95rem}
.tip{background:linear-gradient(135deg,#fff3c4,#ffe0e6);color:#2b1d16;border-radius:16px;padding:12px 14px;font-size:.9rem;margin-top:12px}

/* ---------- Shopping ---------- */
.ctrl{margin:10px 0 4px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.92rem}
.ctrl label b{font-family:Fraunces,serif;font-size:1.5rem;color:var(--accent)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.ctrl .scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:-4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stats div{background:var(--chip);border-radius:16px;padding:10px;text-align:center;font-size:.72rem;color:var(--muted)}
.stats b{display:block;font-family:Fraunces,serif;font-size:1.45rem;color:var(--ink)}
.warn{background:#fff1d6;color:#7a4b00;border-radius:14px;padding:10px 12px;font-size:.85rem;margin-top:10px}
.rayon{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 2px}
.shop li .q{min-width:0;flex:1;font-weight:500}
.shop li .q small{display:block;color:var(--muted);font-size:.75rem}
.shop li .p{font-weight:700;font-size:.9rem;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;text-align:left;font-weight:600}
.menu .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;flex:none}
.menu .x{margin-left:auto;font-size:.75rem;background:var(--chip);border-radius:999px;padding:2px 8px;color:var(--muted)}
.row2{display:flex;gap:10px;margin-top:14px}
.sel{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 10px;max-width:60%}
.shop li .p{text-align:right}
.rg{display:block;font-size:.66rem;font-weight:500;color:var(--muted)}
/* editor */
.fl{display:block;font-weight:600;font-size:.88rem;margin:8px 0}
.fl input,.fl textarea,.irow input,.irow select,.tsel{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px}
.irow{display:grid;grid-template-columns:62px 84px 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.irow input,.irow select{margin:0;padding:9px 8px}
.irow button{border:0;background:var(--chip);border-radius:10px;height:38px;color:var(--muted)}
.tprev{display:flex;gap:14px;align-items:center}
.tprev .cupwrap{width:110px;height:150px;min-height:0;flex:none;margin:0}
.auto{font-size:.72rem;color:var(--accent);font-weight:700}
.dup{border-radius:14px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.dup.same{background:#ffe1e1;color:#8a1020}
.dup.near{background:#fff1d6;color:#7a4b00}
.dup button{border:0;background:rgba(255,255,255,.7);border-radius:999px;padding:3px 10px;font-weight:700;margin-left:4px;color:inherit}
.err{color:#c1121f;font-weight:600;font-size:.85rem;margin-top:8px}
.flabel{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:12px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.pchip{border:0;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:700;color:#2b1d16}
.pchip b{opacity:.55;margin-left:2px}
.pchip.add{background:var(--chip);color:var(--ink);border:1px dashed var(--muted)}
.picker{margin:10px 0 4px}
.plist{max-height:300px;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:16px;padding:4px}
.prow{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px;border-radius:12px;text-align:left}
.prow:active{background:var(--chip)}
.prow .dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:1.15rem;flex:none}
.prow .pn{flex:1;font-weight:600;font-size:.9rem;line-height:1.2}
.prow .pn small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.prow .pc{font-size:.75rem;font-weight:700;color:var(--accent)}
.prow b{width:30px;height:30px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}

/* ---------- Cup animations ---------- */
.w{animation:wave var(--d,4s) linear infinite}
.w.rev{animation-direction:reverse;animation-duration:calc(var(--d,4s)*1.4)}
@keyframes wave{to{transform:translateX(100px)}}
.fill{animation:pour 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes pour{from{transform:translateY(190px)}}
.bub{animation:rise var(--t,3s) ease-in infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-150px);opacity:0}}
.blob{transform-box:fill-box;transform-origin:50% 100%;animation:wob 3.5s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes wob{50%{transform:scale(1.07,.93)}}
.ice{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translateY(5px) rotate(8deg)}}
.drip{animation:drip var(--t,5s) ease-in infinite;animation-delay:var(--dl,0s)}
@keyframes drip{0%,55%{transform:translateY(0);opacity:.9}100%{transform:translateY(38px);opacity:0}}
.tw{animation:tw 2.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{50%{opacity:.15}}
.foam{transform-box:fill-box;transform-origin:center;animation:foam 4s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes foam{50%{transform:translateY(-2px) scale(1.1)}}
/* --- gobelet illustré : animations au repos --- */
.cupsvg *{transform-box:fill-box}
.cupsvg .straw{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.cupsvg .spark{transform-origin:center;animation:spark 2.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes spark{0%,100%{opacity:1;scale:1}50%{opacity:.35;scale:.6}}
.cupsvg .tw{animation:tw 2.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
.cupsvg .ml{opacity:.55}
.cupsvg .drift{animation:drift 6s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes drift{to{transform:translate(10px,-6px)}}
.cupsvg .shard{animation:floaty 3s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes floaty{50%{transform:translateY(-5px) rotate(12deg)}}
.cupsvg .chunk{transform-origin:center;animation:bob 3s ease-in-out infinite;animation-delay:var(--dl,0s)}
.cupsvg .foam{transform-origin:50% 100%;animation:foamy 4s ease-in-out infinite}
@keyframes foamy{50%{transform:scaleY(1.06)}}
.cupsvg .scoop{transform-origin:50% 100%;animation:squish 3.2s ease-in-out infinite}
@keyframes squish{50%{transform:scale(1.025,.98)}}
.cupsvg .gdrip{transform-origin:50% 0;animation:gdrip 3s ease-in-out infinite}
@keyframes gdrip{50%{transform:scaleY(1.25)}}
.cupsvg .gloop{transform-origin:50% 100%;animation:wob 3.5s ease-in-out infinite}

/* --- animations d'arrivée, propres à chaque consistance --- */
.cupsvg.enter .liq{animation:fillUp var(--fd,1s) var(--fe,cubic-bezier(.2,.8,.2,1)) both}
@keyframes fillUp{from{transform:translateY(200px)}}
.cupsvg.enter .ml{animation:mlFlash 1.2s ease-out both}
@keyframes mlFlash{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.15)}100%{opacity:.55;transform:none}}
.cupsvg.enter .cupb{transform-origin:50% 100%}
/* slushy : remplissage, le gobelet frissonne, la glace pilée jaillit, les éclats volent */
.cupsvg.t-slushy{--fd:.9s}
.cupsvg.enter.t-slushy .cupb{animation:shiver .55s .85s linear}

const MILKS = ["lait","vegetal","amande","avoine","coco","noisette","soja","riz"];
function liquidKind(n){
  n=n.toLowerCase();
  if(/végétal/.test(n)) return "vegetal";
  if(/lait de noisette|boisson noisette/.test(n)) return "noisette";
  if(/lait de soja|boisson soja/.test(n)) return "soja";
  if(/lait de riz|boisson riz/.test(n)) return "riz";
  if(/(lait|boisson) d'amande/.test(n)) return "amande";
  if(/(lait|boisson) d'avoine/.test(n)) return "avoine";
  if(/lait de coco|boisson coco/.test(n)) return "coco";
  if(/^lait/.test(n)) return "lait";
  if(/^jus/.test(n)) return "jus";
  if(/^eau|thé|café|limonade/.test(n)) return "eau";
  if(/yaourt|fromage|petit-suisse|skyr/.test(n)) return "yaourt";
  return null;
}
const baseMemo={};
function baseOf(r){
  if(!r.custom && baseMemo[r.id]) return baseMemo[r.id];
  const vol={};
  for(const [q,u,n] of r.ing){ const k=liquidKind(n||""); if(k) vol[k]=(vol[k]||0)+(u==="ml"||u==="g"?q:q*50); }
  let b = MILKS.filter(m=>vol[m]).sort((a,c)=>vol[c]-vol[a])[0];
  if(!b) b = vol.jus||vol.eau ? ((vol.jus||0)>=(vol.eau||0)?"jus":"eau") : vol.yaourt ? "yaourt" : "fruits";
  return r.custom ? b : (baseMemo[r.id]=b);
}

function frac(n){
  const map={0.25:"¼",0.5:"½",0.75:"¾",1.25:"1¼",1.5:"1½",1.75:"1¾",2.5:"2½",3.75:"3¾"};
  if(map[n]) return map[n];
  return Number.isInteger(n)? String(n) : String(Math.round(n*10)/10).replace(".",",");
}
function qty(q,u,mult){
  let v=q*mult;
  if(u==="g"||u==="ml") v=Math.round(v/5)*5; else v=Math.round(v*4)/4;
  return (frac(v)+" "+u).trim();
}

const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){ let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0; return ()=>{ h=(h*1664525+1013904223)>>>0; return h/4294967296; }; }

  if(hit) k=hit[1]; else { k="x_"+n; CAT[k]=[name,EP,"pc",1,"",2]; } // filet de sécurité

const NEED = {};
function needFor(id){

  if(r) r.ing.forEach(([q,u,n])=>{ const k=ingKey(n); if(!k) return; const c=CAT[k];
    m[k]=(m[k]||0) + (u==="" ? q*(c[6]||1) : q*(UNIT[u]??1)); });
  return NEED[id]=m;
}

let priceMemo={};
function cat(k){
  const memoKey=state.region+"|"+state.priceMode+"|"+k;
  if(priceMemo[memoKey]) return priceMemo[memoKey];
  const c=CAT[k], reg=REGIONS[state.region]||REGIONS.metro, o=reg.over[k]||{};
  const base = o.prix ?? (c[5]||0)*(reg.mult[c[1]]||1);
  const months = SEASONS[reg.saison][k];
  let prix=base, lo=base, hi=base, saison=null;
  if(months){
    lo=base*IN_SEASON; hi=base*OFF_SEASON;
    const avg = base*(IN_SEASON*months.length + OFF_SEASON*(12-months.length))/12;
    const now = new Date().getMonth()+1, inS = months.includes(now);
    saison = inS ? "in" : "off";
    prix = state.priceMode==="moyen" ? avg : (inS ? lo : hi);
  }
  return priceMemo[memoKey]={nom:o.nom||c[0], rayon:o.rayon||c[1], pack:o.pack||c[3], label:o.label||c[4],
    prix, lo, hi, saison, volatile:!!months, staple:c[1]===PL};
}

function buildList(plan){
  const need={};
  plan.forEach(id=>{ const n=needFor(id); for(const k in n) need[k]=(need[k]||0)+n[k]; });
  let total=0, lo=0, hi=0, distinct=0; const items=[];
  for(const k in need){
    const c=cat(k), staple=c.staple;
    const packs = staple?0:Math.max(1,Math.ceil(need[k]/c.pack-1e-6));
    const cost = staple?0:packs*c.prix;
    total+=cost; lo+=staple?0:packs*c.lo; hi+=staple?0:packs*c.hi; if(!staple) distinct++;
    items.push({k,nom:c.nom,rayon:c.rayon,packs,label:c.label,cost,lo:packs*c.lo,hi:packs*c.hi,saison:c.saison,volatile:c.volatile,staple});
  }
  return {items,total,lo,hi,distinct};
}

  while(plan.length<N){
    let opts=[];
    for(const r of R){
      if((count[r.id]||0)>=2) continue;
      const L=buildList([...plan,r.id]);
      opts.push([score(L)+(count[r.id]?1.5:0)+Math.random()*1.2, r.id]);
    }
    opts.sort((a,b)=>a[0]-b[0]);
    const id=opts[Math.floor(Math.random()*Math.min(3,opts.length))][1];
    plan.push(id); count[id]=(count[id]||0)+1;
  }
  return plan;
}
function generateWeek(N,budget,fixed=[]){
  if(fixed.length>=N) return {plan:fixed.slice(0,N), reduced:false, over:buildList(fixed).total>budget};
  const runs=[]; for(let i=0;i<70;i++) runs.push(greedyRun(N,fixed));
  for(let n=N;n>=Math.max(1,fixed.length);n--){
    const fits = runs.map(p=>p.slice(0,n)).map(p=>({p,L:buildList(p)})).filter(x=>x.L.total<=budget);
    if(fits.length){
      fits.sort((a,b)=>score(a.L)-score(b.L));
      const pick=fits[Math.floor(Math.random()*Math.min(4,fits.length))];
      return {plan:pick.p, reduced:n<N};
    }
  }
  if(fixed.length) return {plan:fixed, reduced:true, over:true};
  return {plan:[], reduced:true};
}

    if(/banane/.test(n)) banana=true;
    if(/glaçon/.test(n)) ice+=q;
    else if(/surgel|congel/.test(n)) frozen+=w;
    else if(/yaourt|fromage|petit-suisse|skyr/.test(n)){ dairy+=w; thick+=w*.5; }
    else if(layer===3){ liquid+=w; if(/lait|coco/.test(n)) dairy+=w*.6; }
    else if(/avoine|chia|beurre|purée d'|datte|avocat|protéine/.test(n)) thick+=w*(/avoine|chia/.test(n)?3:1.5);
    else if(layer!==4) fresh+=w;
    const p=PAL.find(([re])=>re.test(n));
    const ww = layer===3 ? w*.4 : w;
    if(p && ww>bestW){ bestW=ww; best=p; }
  }
  const t = knnTexture(features(ing));
  const all=ing.map(i=>(i[2]||"").toLowerCase()).join(" ");
  const tags=TAGRULES.filter(([re])=>re.test(all)).map(x=>x[1]).slice(0,3);
  return {t, tags, c: best?best[1]:["#f6e7d8","#d8a47f"], emoji: best?best[2]:"🥤"};
}
// Détection du type : on compare la composition aux recettes de base les plus proches (k plus proches voisins)
const WATERY=/pastèque|melon|ananas|orange|clémentine|pamplemousse|concombre|letchi|litchi|raisin|papaye|carambole|kiwi|fraise|citron|pêche|grenade|goyavier/;
function features(ing){
  const f=[0,0,0,0,0,0,0,0,0]; // fin, lait, yaourt, fruit juteux, fruit dense, surgelé, banane surgelée, glace, épaississant
  for(const [q0,u,n0] of ing){
    const n=(n0||"").toLowerCase(), q=+q0||0; if(!n) continue;
    const w=gOf(q,u,n), layer=guessLayer(n,u);
    if(/glaçon/.test(n)) f[7]+=q*25;
    else if(/banane/.test(n) && /surgel|congel/.test(n)) f[6]+=w;
    else if(/surgel|congel/.test(n)) f[5]+=w;
    else if(/yaourt|fromage|petit-suisse|skyr/.test(n)) f[2]+=w;
    else if(/lait|boisson/.test(n)) f[1]+=w;
    else if(layer===3) f[0]+=w;
    else if(/avoine|chia|beurre|purée d'|datte|protéine|cacao/.test(n)) f[8]+=w*(/avoine|chia/.test(n)?3:2);
    else if(layer===4||layer===2) continue;
    else if(WATERY.test(n)) f[3]+=w; else f[4]+=w;
  }
  const s=f.reduce((a,b)=>a+b,0)||1;
  return f.map(x=>x/s);
}
let BASEF=null;
function knnTexture(v, exceptId){
  if(!BASEF) BASEF=R.filter(r=>!r.custom).map(r=>({id:r.id,t:r.t,f:features(r.ing)}));
  const W=[1,1.2,1.2,1,1,1.2,1.3,1.5,1.3];
  const d=BASEF.filter(b=>b.id!==exceptId).map(b=>({t:b.t,d:Math.sqrt(b.f.reduce((a,x,i)=>a+W[i]*(x-v[i])**2,0))})).sort((a,b)=>a.d-b.d).slice(0,5);
  const score={}; d.forEach(x=>score[x.t]=(score[x.t]||0)+1/(x.d+.05));
  return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
}
function keySet(ing){ return new Set(ing.map(i=>ingKey(i[2]||"")).filter(k=>k && !(CAT[k]&&CAT[k][1]===PL))); }
function findSimilar(ing, exceptId){
  const a=keySet(ing); if(a.size<2) return null;
  let best=null;
  for(const r of R){ if(r.id===exceptId) continue;
    const b=keySet(r.ing); let inter=0; a.forEach(k=>{ if(b.has(k)) inter++; });
    const j=inter/(a.size+b.size-inter);
    if(!best||j>best.j) best={r,j};
  }
  return best && best.j>=.6 ? best : null;
}

  if(nr) nr.addEventListener("input", ()=>{ $("#nVal").textContent=nr.value; $("#mix").textContent=mixLabel(+nr.value); });
  const rg=$("#region");
  if(rg) rg.addEventListener("change", ()=>{ state.region=rg.value; store.set("region",state.region); priceMemo={}; render(); });
  const ps=$("#pickSearch");
  if(ps) ps.addEventListener("input", ()=>{ const q=ps.value.trim().toLowerCase(); state.pq=ps.value;
    document.querySelectorAll(".prow").forEach(b=>b.style.display = !q || b.dataset.s.includes(q) ? "" : "none"); });
  if(br) br.addEventListener("input", ()=>{ $("#bVal").textContent= +br.value>=81 ? "Sans limite" : br.value+" €"; });
  setupScrollers();
  const xl=$("#exLeft");
  if(xl) xl.addEventListener("change", ()=>{ state.exLeft=xl.checked; const y=scrollY; render(); scrollTo(0,y); });
}

// Rangées de filtres : flèches visibles seulement s'il reste des choix cachés de ce côté
function setupScrollers(){
  document.querySelectorAll(".scroller").forEach(sc=>{
    const c=sc.querySelector(".chips");
    const upd=()=>{ const over=c.scrollWidth>c.clientWidth+2;
      sc.classList.toggle("can-l", over && c.scrollLeft>4);
      sc.classList.toggle("can-r", over && c.scrollLeft+c.clientWidth<c.scrollWidth-4); };
    const on=c.querySelector(".on");
    if(on && on.offsetLeft+on.offsetWidth>c.clientWidth-40){
      c.style.scrollBehavior="auto"; c.scrollLeft=on.offsetLeft-c.clientWidth/2+on.offsetWidth/2; c.style.scrollBehavior=""; }
    c.addEventListener("scroll",upd,{passive:true}); upd();
  });
}
window.addEventListener("resize", ()=>document.querySelectorAll(".scroller .chips").forEach(c=>c.dispatchEvent(new Event("scroll"))));

function go(view){ state.view=view; window.scrollTo({top:0}); render(); }
function open(id){ if(state.view!=="detail"){ state.from=state.view; state.listY=(state.view==="all"||state.view==="favs")?scrollY:null; } state.id=id; state.size=1; go("detail"); }
// Retour : on revient à la liste exactement là où était la recette cliquée
function goBack(){ const to=state.from||"home"; state.view=to; render(); const y=(to==="all"||to==="favs")?state.listY:null; scrollTo(0, y!=null ? y : 0); }
function reroll(){ state.enter=true; state.univers==="chef" ? ckPickRandom() : pickRandom(); render(); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button, .ing li");
  if(!t) return;
  if(t.dataset.shop){ const c=state.week.checked, i=c.indexOf(t.dataset.shop); i<0?c.push(t.dataset.shop):c.splice(i,1); store.set("week",state.week); t.classList.toggle("done"); const pre=$(".expre"); if(pre) pre.textContent=weekText(); return; }
  /* --- univers & Chef's Kiss --- */
  if(t.dataset.univ){ if(state.univers!==t.dataset.univ){ state.univers=t.dataset.univ; store.set("univers",state.univers); state.q=""; state.enter=true; window.scrollTo({top:0}); render(); } return; }
  if(t.dataset.ckf){ const [k,v]=t.dataset.ckf.split(":"); state.ckf[k]=v; if(k==="grp") state.ckf.sub="tous"; state.ckLimit=60; return render(); }
  if(t.id==="ckMore"){ state.ckLimit=(state.ckLimit||60)+60; const y=scrollY; render(); return scrollTo(0,y); }
  if(t.dataset.ckadd){ const id=t.dataset.ckadd, p=state.ckPick, i=p.indexOf(id);
    if(state.view==="detail"){ i<0?p.push(id):p.splice(i,1); store.set("ckpick",p); return render(); }
    if(i<0) p.push(id); store.set("ckpick",p); const sc=$(".plist")?.scrollTop||0, q=$("#pickSearch")?.value||""; render();
    const ps=$("#pickSearch"); if(ps&&q){ ps.value=q; ps.dispatchEvent(new Event("input")); } const pl=$(".plist"); if(pl) pl.scrollTop=sc; return; }
  if(t.dataset.ckunpick){ state.ckPick=state.ckPick.filter(x=>x!==t.dataset.ckunpick); store.set("ckpick",state.ckPick); return render(); }
  if(t.matches(".ing li")) return t.classList.toggle("done");
  if(t.dataset.add){
    if(state.view==="detail"){ addPick(t.dataset.add); return render(); }
    const sc=$(".plist")?.scrollTop||0, q=state.pq||"";
    if(state.week) state.week.n=Math.max(state.week.n||0, state.pick.length+1);
    addPick(t.dataset.add); render();
    const pl=$(".plist"), ps=$("#pickSearch");
    if(ps && q){ ps.value=q; ps.dispatchEvent(new Event("input")); }
    if(pl) pl.scrollTop=sc; return;
  }
  if(t.dataset.pmode){ state.priceMode=t.dataset.pmode; store.set("priceMode",state.priceMode); priceMemo={}; return render(); }
  if(t.id==="newRecipe"){ state.draft=newDraft(); state.from="all"; return go("create"); }
  if(t.id==="addRow"){ state.draft.ing.push({q:1,u:"",n:""}); render(); const ins=document.querySelectorAll('[data-k="n"]'); return ins[ins.length-1]?.focus(); }
  if(t.dataset.delrow){ state.draft.ing.splice(+t.dataset.delrow,1); return render(); }
  if(t.dataset.tagtoggle){ const d=state.draft, g=t.dataset.tagtoggle; d.tagsAuto=false; d.tags=d.tags.includes(g)?d.tags.filter(x=>x!==g):[...d.tags,g]; return updateDraftUI(); }
  if(t.id==="saveRecipe") return saveRecipe();
  if(t.dataset.edit) return editRecipe(t.dataset.edit);
  if(t.dataset.del) return deleteRecipe(t.dataset.del);
  if(t.dataset.unpick){ unpick(t.dataset.unpick); return render(); }
  if(t.dataset.arr){ const c=t.parentElement.querySelector(".chips"); return c.scrollBy({left:+t.dataset.arr*c.clientWidth*.7}); }
  if(t.dataset.tex){ state.texture=t.dataset.tex; return render(); }
  if(t.id==="togglePicker"){ state.picker=!state.picker; state.pq=""; return render(); }
  if(t.dataset.ptab){ state.ptab=t.dataset.ptab; state.pq=""; return render(); }
  if(t.id==="genWeek"){ t.textContent="⏳ Je cherche…"; return setTimeout(genWeek,30); }
  if(t.id==="toggleExport"){ state.exOpen=!state.exOpen; render(); const ex=$(".export"); if(ex) ex.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.exfmt){ state.exFmt=t.dataset.exfmt; store.set("exFmt",state.exFmt); const y=scrollY; render(); return scrollTo(0,y); }
  if(t.dataset.ex) return doExport(t.dataset.ex);
  if(t.dataset.view){ state.filter="tous"; go(t.dataset.view); }
  else if(t.dataset.open) open(t.dataset.open);
  else if(t.dataset.tag){ state.filter=t.dataset.tag; render(); }
  else if(t.dataset.base){ state.base=t.dataset.base; render(); }
  else if(t.dataset.size){ state.size=+t.dataset.size; render(); }
  else if(t.id==="reroll"||t.id==="cup") reroll();
  else if(t.id==="toggleSide"){ state.side=!state.side; store.set("side",state.side); render(); }
  else if(t.id==="randomFromDetail"){ if(isCK(state.id)){ ckPickRandom(); state.id=state.ckRandom; } else { pickRandom(); state.id=state.randomId; } state.size=1; window.scrollTo({top:0}); render(); }
  else if(t.id==="back") goBack();
  else if(t.id==="fav"){ favs.has(state.id)?favs.delete(state.id):favs.add(state.id); store.set("favs",[...favs]); render(); }
});

// Formulaire de recette perso
document.addEventListener("input", e=>{
  if(state.view!=="create"||!state.draft) return;
  const el=e.target, d=state.draft;
  if(el.dataset.f){ d[el.dataset.f]=el.value; if(el.dataset.f==="t") d.tAuto=false; if(el.dataset.f==="emoji") d.emojiAuto=false; }
  else if(el.dataset.row!==undefined){ const x=d.ing[+el.dataset.row]; const k=el.dataset.k;
    x[k] = k==="q" ? (parseFloat(String(el.value).replace(",","."))||0) : el.value; }
  else return;
  updateDraftUI();
});

// Bouton retour Android : revient en arrière dans l'app avant de la quitter
window.appBack = () => {
  if(state.view==="detail"||state.view==="create"){ goBack(); return true; }
  if(state.view!=="home"){ go("home"); return true; }
  return false;
};

// secouer le téléphone = nouveau shakie
let lastShake=0;
window.addEventListener("devicemotion", e=>{
  const a=e.accelerationIncludingGravity; if(!a||state.view!=="home") return;
  const f=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
  if(f>38 && Date.now()-lastShake>1200){ lastShake=Date.now(); reroll(); }
});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
</script>
</body>
